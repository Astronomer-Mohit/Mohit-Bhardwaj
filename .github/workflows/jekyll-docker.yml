name: Hugo site CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go for Hugo modules
        uses: actions/setup-go@v5
        with:
          go-version: "1.20.x"

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.79.1"
          extended: true

      - name: Build the site
        run: hugo --gc --minify --buildFuture -b https://example.org/
